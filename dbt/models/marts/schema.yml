version: 2

models:
  - name: repo_daily
    description: >
      Daily activity per repository: how much happened, how many distinct people
      made it happen, and the breakdown by event type.
    columns:
      - name: day
        description: The UTC day the events belong to.
        data_tests:
          - not_null
      - name: repo_id
        description: Numeric repository id.
        data_tests:
          - not_null
      - name: repo_name
        description: The repository's name as of that day's most recent event.
        data_tests:
          - not_null
      - name: events
        description: Events recorded for this repository on this day.
        data_tests:
          - not_null
      - name: actors
        description: Distinct accounts that produced them.
        data_tests:
          - not_null

  - name: repo_trending
    description: >
      Day-over-day movement in distinct participating accounts per repository,
      restricted to calendar-adjacent days the lake holds in full. Measures
      participation rather than popularity, and carries no verdict about whether
      any movement is organic — that requires actor-quality and coordination
      modelling this project has not built.
    columns:
      - name: day
        description: The UTC day being measured.
        data_tests:
          - not_null
      - name: repo_id
        description: Numeric repository id.
        data_tests:
          - not_null
      - name: repo_name
        description: The repository's name as of that day's most recent event.
        data_tests:
          - not_null
      - name: actors
        description: Distinct accounts that touched the repository on `day`.
        data_tests:
          - not_null
      - name: actors_prior
        description: >
          The same count for the previous calendar day, zero when the repository
          had no events. Zero means measured silence, not an unobserved day — the
          model only pairs days the lake holds in full.
        data_tests:
          - not_null
      - name: actors_change
        description: >
          `actors` minus `actors_prior`. The column the day's ranking is built on,
          in preference to the ratio, because actor counts are small integers.
        data_tests:
          - not_null
      - name: actors_change_ratio
        description: >
          Proportional change, null when there was no prior activity to divide by.
          Reported rather than ranked on.
      - name: rank_in_day
        description: >
          Position within the day by `actors_change`, ties broken by `actors` and
          then `repo_id` so a rebuild over unchanged data reproduces the order.
        data_tests:
          - not_null

  - name: ecosystem_daily
    description: >
      One row per day for the whole ecosystem, carrying the coverage the totals
      were computed from. A daily total without `hours_present` beside it is a sum
      over an unknown fraction of the day.
    columns:
      - name: day
        description: The UTC day the events belong to.
        data_tests:
          - not_null
          - unique
      - name: events
        description: Every event published that day and held in the lake.
        data_tests:
          - not_null
      - name: repos
        description: Distinct repositories active that day.
        data_tests:
          - not_null
      - name: actors
        description: Distinct accounts active that day.
        data_tests:
          - not_null
      - name: hours_present
        description: >
          How many of the day's 24 hours the lake holds. A day mid-ingest and a day
          with permanent publisher gaps are identical in every other column.
        # Range-checked by `assert_ecosystem_daily_is_sane`, a singular test, rather
        # than by a package's `accepted_range`. The bound is worth asserting; a
        # whole dependency added in order to assert it is not.
        data_tests:
          - not_null
      - name: events_without_repo
        description: >
          Events published with an empty repository object. Counted rather than
          dropped, because `repo_daily` excludes them and the two marts can only be
          reconciled if the difference between them is a recorded number.
        data_tests:
          - not_null
