[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "reporadar"
version = "0.1.0"
description = "Ecosystem intelligence for open source — live GitHub event ingestion with self-measured coverage, archive-backed deep history, and honest metrics"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    # HTTP — async client for the live poller, sync for archive downloads
    "httpx>=0.27,<2.0",

    # Every I/O boundary is a model; settings come from env/.env only
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",

    # CLI entrypoints for ingestion and analysis commands
    "typer>=0.12,<1.0",

    # Async Kafka client — the producer side of the streaming path
    "aiokafka>=0.11,<0.13",

    # Async Postgres driver — the validated store writes to TimescaleDB, which
    # is Postgres on the wire, so the driver is the only thing the store needs
    "asyncpg>=0.30,<0.32",

    # In-process analytics — reads gzipped NDJSON archive hours directly,
    # so exploration and reconciliation are single SQL queries, no ETL
    "duckdb>=1.1,<2.0",
]

[project.scripts]
reporadar = "reporadar.cli:main"

[project.optional-dependencies]
# The transformation layer. Deliberately optional rather than a runtime
# dependency: it pulls ~58 packages that the poller, the consumer and the
# archive ingest have no use for, and the container image runs those three.
# Installed by anyone building the marts (`uv sync --extra dbt`) and by CI.
dbt = [
    "dbt-core>=1.8,<2.0",
    # DuckDB rather than Postgres as the adapter: the models read the Parquet
    # lake, which is where the events actually are. The marts are written into
    # Postgres from there, because that is what the dashboard can read.
    "dbt-duckdb>=1.8,<2.0",
]
dev = [
    "pytest>=8.2,<10.0",
    "pytest-asyncio>=0.23,<2.0",
    "respx>=0.21,<1.0",            # httpx transport mocking — the test suite never touches the network
    "ruff>=0.15,<1.0",
    "mypy>=1.13,<2.0",
    "pre-commit>=4.0,<6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "PIE"]
ignore = [
    "E501", # line length — handled by the formatter
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# `tools/` holds standalone scripts rather than importable package code, so it is
# not on the path by default and its logic would be untestable. Naming the
# directory rather than the repository root is deliberate: the root also holds
# `dbt/`, which has no `__init__.py` and would shadow the installed `dbt`
# package as an implicit namespace package the moment the root went on the path.
pythonpath = ["tools"]

[tool.mypy]
python_version = "3.12"
strict = true
# `tools/` is checked as strictly as the package: it is the only place a figure
# on the published page can come from, so it is not a scratch directory.
files = ["src", "tests", "tools"]
mypy_path = "tools"

[[tool.mypy.overrides]]
# duckdb's Python API doesn't ship complete stubs; contain the gap to this module
module = "duckdb"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# aiokafka ships no py.typed marker; contain the gap to this module
module = "aiokafka.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# asyncpg ships no py.typed marker; contain the gap to this module
module = "asyncpg.*"
ignore_missing_imports = true
