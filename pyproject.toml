[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "reporadar"
version = "0.1.0"
description = "Ecosystem intelligence for open source — live GitHub event ingestion, reconciled against the full archive, with honest metrics"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    # HTTP — async client for the live poller, sync for archive downloads
    "httpx>=0.27,<2.0",

    # Every I/O boundary is a model; settings come from env/.env only
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",

    # CLI entrypoints for ingestion and analysis commands
    "typer>=0.12,<1.0",

    # Async Kafka client — the producer side of the streaming path
    "aiokafka>=0.11,<0.13",

    # In-process analytics — reads gzipped NDJSON archive hours directly,
    # so exploration and reconciliation are single SQL queries, no ETL
    "duckdb>=1.1,<2.0",
]

[project.scripts]
reporadar = "reporadar.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<10.0",
    "pytest-asyncio>=0.23,<2.0",
    "respx>=0.21,<1.0",            # httpx transport mocking — the test suite never touches the network
    "ruff>=0.15,<1.0",
    "mypy>=1.13,<2.0",
    "pre-commit>=4.0,<6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "PIE"]
ignore = [
    "E501", # line length — handled by the formatter
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# duckdb's Python API doesn't ship complete stubs; contain the gap to this module
module = "duckdb"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# aiokafka ships no py.typed marker; contain the gap to this module
module = "aiokafka.*"
ignore_missing_imports = true
