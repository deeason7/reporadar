# Local development stack. Host ports come from .env (defaults shifted off
# the standard ports so this stack coexists with other local projects).
#
# Kafka runs single-node KRaft — replication factor 1 is a dev-only setting.

services:
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Two data listeners: INTERNAL for other containers, HOST for the laptop.
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false" # topics are created deliberately, with configs
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10

  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reporadar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-reporadar}
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reporadar}"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana-oss:11.6.1
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      timescaledb:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Application services. All four run the same image and pick a role with a
  # command, so no deploy can put a different build behind one process than
  # another.
  #
  # They sit behind the `app` profile, which means `docker compose up -d` still
  # brings up only the infrastructure — the local workflow is unchanged, and a
  # developer running it does not silently start polling GitHub. The full stack
  # is `docker compose --profile app up -d`, which is also the deploy command.
  #
  # Two things about configuration, both of which follow from where the values
  # come from. `env_file` supplies the token and shared settings, and is marked
  # optional so `docker compose config` still resolves on a fresh clone that has
  # no .env yet (CI does exactly that). The `environment` block then overrides
  # the two addresses that differ inside this network: .env holds what a
  # developer needs from the host — localhost and a shifted port — and inside a
  # container localhost is the container. Compose gives `environment` precedence
  # over `env_file`, which is what makes the override work rather than conflict.
  # ---------------------------------------------------------------------------

  # One-shot, and everything that reads or writes the stream waits for it to
  # succeed. Topics are created deliberately (auto-create is off on the broker),
  # so without this the readers fail their own preflight on a fresh volume.
  provision:
    build: .
    profiles: ["app"]
    command: ["provision"]
    env_file:
      - path: .env
        required: false
    environment:
      REPORADAR_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  serve:
    build: .
    profiles: ["app"]
    command: ["serve", "--interval-s", "${SERVE_INTERVAL_S:-10}", "--pages", "${SERVE_PAGES:-3}"]
    env_file:
      - path: .env
        required: false
    environment:
      REPORADAR_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    volumes:
      - app_data:/app/data
    depends_on:
      provision:
        condition: service_completed_successfully
    restart: unless-stopped

  consume:
    build: .
    profiles: ["app"]
    command: ["consume"]
    env_file:
      - path: .env
        required: false
    environment:
      REPORADAR_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      REPORADAR_POSTGRES_DSN: postgresql://${POSTGRES_USER:-reporadar}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@timescaledb:5432/${POSTGRES_DB:-reporadar}
    volumes:
      - app_data:/app/data
    depends_on:
      provision:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  # Touches no broker at all — it reads the published archive and writes the
  # columnar store and the hours ledger — so it waits only on the database.
  archive-serve:
    build: .
    profiles: ["app"]
    command:
      [
        "archive-serve",
        "--interval-s",
        "${ARCHIVE_SCAN_INTERVAL_S:-900}",
        "--concurrency",
        "${ARCHIVE_CONCURRENCY:-3}",
        "--lookback-days",
        "${ARCHIVE_LOOKBACK_DAYS:-3}",
      ]
    env_file:
      - path: .env
        required: false
    environment:
      REPORADAR_POSTGRES_DSN: postgresql://${POSTGRES_USER:-reporadar}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@timescaledb:5432/${POSTGRES_DB:-reporadar}
    volumes:
      - app_data:/app/data
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kafka_data:
  timescale_data:
  grafana_data:
  app_data:
