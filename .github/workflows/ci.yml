# Zero-warning gate on every push/PR: style, format, types, tests.
# The test suite needs no external services, so the job stays fast.
name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install with dev tools
        run: uv sync --extra dev

      - name: Lint (zero-warning policy)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type-check (strict)
        run: uv run mypy

      - name: Tests
        run: uv run pytest -q

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the compose file (syntax + variable resolution)
        env:
          POSTGRES_PASSWORD: ci-validate
          GRAFANA_ADMIN_PASSWORD: ci-validate
          GRAFANA_DB_PASSWORD: ci-validate
        # Both ways round: the default set is the infrastructure a developer
        # starts, and the app profile is what a deploy runs. Only checking the
        # default set would leave every application service unvalidated.
        run: |
          docker compose config -q
          docker compose --profile app config -q

      - name: Check what the compose file actually says
        env:
          POSTGRES_PASSWORD: ci-validate
          GRAFANA_ADMIN_PASSWORD: ci-validate
          GRAFANA_DB_PASSWORD: ci-validate
        # `config -q` proves the file parses and every variable resolves. It
        # proves nothing about what the file *says*, and three of the things it
        # says matter: a published port that binds every interface is reachable
        # from the network the machine is on, and none of these services
        # authenticates anyone; infrastructure without a restart policy leaves
        # the application restarting into dependencies that never come back; and
        # an unbounded log driver fills the same disk the data is written to.
        #
        # This reads the RESOLVED config, not the file. Variable interpolation
        # is exactly where a port binding can change without the text changing,
        # so reading the source would check the wrong artifact.
        run: |
          python3 - <<'EOF'
          import json, subprocess, sys

          cfg = json.loads(subprocess.run(
              ["docker", "compose", "--profile", "app", "config", "--format", "json"],
              check=True, capture_output=True, text=True).stdout)

          problems = []
          for name, svc in sorted(cfg["services"].items()):
              for p in svc.get("ports", []):
                  host_ip = p.get("host_ip", "")
                  if host_ip not in ("127.0.0.1", "::1"):
                      problems.append(
                          f"{name}: publishes {p.get('published')} on {host_ip or '0.0.0.0'} "
                          f"— reachable from the network, and nothing here authenticates")
              if "restart" not in svc:
                  problems.append(f"{name}: no restart policy")
              if svc.get("logging", {}).get("driver") != "json-file":
                  problems.append(f"{name}: no json-file logging driver")
              elif not svc["logging"].get("options", {}).get("max-size"):
                  problems.append(f"{name}: logging is unbounded (no max-size)")

          print(f"checked {len(cfg['services'])} services")
          if problems:
              print("\n".join("  FAIL " + p for p in problems))
              sys.exit(1)
          print("  all services: loopback-only publishes, a restart policy, bounded logs")
          EOF

      - name: Negative control — the check must be able to fail
        env:
          POSTGRES_PASSWORD: ci-validate
          GRAFANA_ADMIN_PASSWORD: ci-validate
          GRAFANA_DB_PASSWORD: ci-validate
        # A check that has never been watched failing is not known to work. This
        # republishes Kafka on every interface in an overlay and requires the
        # check above to reject it. If this step passes, the real one is blind.
        run: |
          cat > /tmp/expose.yml <<'EOF'
          services:
            kafka:
              ports: !override ["0.0.0.0:9092:9092"]
          EOF
          out="$(docker compose -f docker-compose.yml -f /tmp/expose.yml --profile app config --format json)"
          if echo "$out" | python3 -c "
          import json,sys
          cfg = json.load(sys.stdin)
          bad = [p for p in cfg['services']['kafka'].get('ports', [])
                 if p.get('host_ip','') not in ('127.0.0.1','::1')]
          sys.exit(0 if bad else 1)"; then
            echo "negative control fired: an all-interfaces publish is visible to the check"
          else
            echo "NEGATIVE CONTROL FAILED — the check cannot see an exposed port"; exit 1
          fi

  marts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: reporadar
          POSTGRES_PASSWORD: ci-validate
          POSTGRES_DB: reporadar
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 10
    env:
      REPORADAR_POSTGRES_DSN: postgresql://reporadar:ci-validate@localhost:5432/reporadar
      REPORADAR_DATA_DIR: /tmp/lake-fixture
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install with the transformation tools
        run: uv sync --extra dev --extra dbt

      # A lake to build from. CI has no archive, so the models get a small one
      # with the shapes that matter: two days, several event types, and one event
      # id appearing twice — because a deduplication nothing ever duplicates is
      # not being tested.
      #
      # Never add `dbt debug` to this job: it prints the resolved profile,
      # credentials included, and workflow logs on a public repository are public.
      - name: Build a lake fixture
        # `uv run`, not the system python: this needs duckdb, which lives in the
        # project environment. The other heredoc steps in this file use only the
        # standard library, so the pattern does not carry over.
        run: |
          uv run python - <<'EOF'
          import duckdb
          rows = []
          for day, hour, n in (("2026-07-22", 21, 40), ("2026-07-22", 22, 30), ("2026-07-23", 3, 20)):
              for i in range(n):
                  kind = ("PushEvent", "WatchEvent", "ForkEvent", "IssuesEvent")[i % 4]
                  rows.append((
                      f"{day}-{hour}-{i}", kind,
                      f'{{"id":{i % 7},"login":"actor{i % 7}"}}',
                      f'{{"id":{i % 5},"name":"owner/repo{i % 5}"}}',
                      "null", "{}", True, f"{day} {hour:02d}:{i % 60:02d}:00",
                  ))
          # The same event id twice, as a redelivered hour would produce.
          rows.append(rows[0])
          con = duckdb.connect()
          con.execute("""
              CREATE TABLE ev (id VARCHAR, type VARCHAR, actor JSON, repo JSON,
                               org JSON, payload JSON, public BOOLEAN, created_at TIMESTAMP)
          """)
          con.executemany("INSERT INTO ev VALUES (?,?,?,?,?,?,?,?)", rows)
          for day, hour in (("2026-07-22", 21), ("2026-07-22", 22), ("2026-07-23", 3)):
              out = f"/tmp/lake-fixture/lake/dt={day}/hr={hour}"
              __import__("os").makedirs(out, exist_ok=True)
              con.execute(
                  f"""COPY (SELECT * FROM ev
                            WHERE cast(created_at AS DATE) = DATE '{day}'
                              AND extract(hour FROM created_at) = {hour})
                      TO '{out}/events.parquet' (FORMAT PARQUET)"""
              )
          print("fixture written")
          EOF

      - name: Build the marts and run their tests
        run: uv run dbt build --project-dir dbt --profiles-dir dbt

      # The models ran and the tests passed — but tests that cannot fail prove
      # nothing about the data. This files an hour's events under the wrong hour,
      # which is the one thing `repo_daily` relies on not happening: it groups on
      # the partition rather than the timestamp, and those are only the same
      # question while every file holds the hour it is named for.
      - name: Negative control — the data tests must be able to fail
        # The models ran and the tests passed, which proves nothing until the
        # tests have been watched failing. This files events under an hour they
        # do not belong to — the one thing `repo_daily` relies on not happening,
        # since it groups on the partition rather than the timestamp.
        #
        # The ids are rewritten rather than the file simply copied, and that
        # detail is the whole control. A plain copy produces rows that share an
        # id with correctly-filed ones, the staging dedup keeps one row per id,
        # and every misfiled row disappears before any test can see it — a
        # negative control that quietly tests nothing. Measured while writing
        # this: 40 misfiled rows in, 0 surviving.
        run: |
          uv run python - <<'EOF'
          import os
          import duckdb
          out = "/tmp/lake-fixture/lake/dt=2026-07-22/hr=5"
          os.makedirs(out, exist_ok=True)
          duckdb.connect().execute(f"""
              COPY (SELECT 'misfiled-' || id AS id, type, actor, repo, org,
                           payload, public, created_at
                    FROM read_parquet(
                      '/tmp/lake-fixture/lake/dt=2026-07-22/hr=21/events.parquet'))
              TO '{out}/events.parquet' (FORMAT PARQUET)
          """)
          EOF
          if uv run dbt build --project-dir dbt --profiles-dir dbt \
               --select stg_events assert_partition_matches_event_time; then
            echo "NEGATIVE CONTROL FAILED — a misfiled hour passed the checks"; exit 1
          else
            echo "negative control fired: a misfiled hour is visible to the tests"
          fi

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the runtime image
        run: docker build -t reporadar:ci .

      - name: Run it
        # Building is not the check. The first version of this image built,
        # exported and tagged without a single warning, and then died on
        # `ModuleNotFoundError` the first time its entrypoint ran, because the
        # project was installed editable and the runtime stage carries only the
        # virtualenv. A build-only job would have shipped that.
        run: |
          docker run --rm reporadar:ci --help | grep -q archive-serve
          uid="$(docker run --rm --entrypoint id reporadar:ci -u)"
          test "$uid" != "0" || { echo "the image runs as root"; exit 1; }
          echo "entrypoint works; runs as uid $uid"

      - name: The transformation tools stay out of the runtime image
        # They are an optional extra precisely so the services that poll, consume
        # and ingest do not carry ~58 packages they never import. Nothing enforces
        # that but the absence of a flag in the Dockerfile, which is one careless
        # edit from changing.
        run: |
          if docker run --rm --entrypoint python reporadar:ci -c "import dbt" 2>/dev/null; then
            echo "the runtime image carries the transformation tooling"; exit 1
          fi
          echo "runtime image carries no transformation tooling"

  dashboards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check what the provisioning actually says
        # The dashboard is provisioned from files, which makes it reviewable — and
        # makes it possible to assert things about it that are otherwise only
        # discovered by starting Grafana and clicking.
        #
        # Three properties, each of which has a failure that names neither the file
        # nor the cause:
        #
        # 1. Grafana substitutes `${VAR}` in provisioning files but does NOT
        #    understand the shell's `${VAR:-default}`. Written that way, the value
        #    resolves to an empty string; an empty database name then makes the
        #    driver fall back to the user, and the error is
        #    `database "grafana_reader" does not exist` — which points at neither
        #    the variable nor the file that set it. Defaults belong in the compose
        #    file, which does understand that syntax.
        #
        # 2. A credential must never be a literal here. This file is committed.
        #
        # 3. The dashboard must not query the per-account schema, or the raw event
        #    table. The database grant already refuses both, and that is the real
        #    boundary; this is the cheaper one that fails in review rather than at
        #    runtime, and it catches the panel before somebody wonders why it is
        #    empty and "fixes" it by widening the grant.
        run: |
          python3 - <<'EOF'
          import json, pathlib, re, sys

          problems = []
          prov = sorted(pathlib.Path("grafana/provisioning").rglob("*.yml"))
          if not prov:
              problems.append("no provisioning files found — the check is looking in the wrong place")

          def settings_only(text):
              # Comments are stripped before scanning, because the file that gets
              # this right explains why — quoting the broken syntax in the sentence
              # warning against it. Scanning raw text makes the explanation itself
              # the finding, which is a check that punishes documenting the trap.
              return "\n".join(re.sub(r"(?:^|\s)#.*$", "", line) for line in text.splitlines())

          for f in prov:
              text = settings_only(f.read_text())
              for m in re.finditer(r"\$\{[A-Za-z_][A-Za-z0-9_]*:[-?][^}]*\}", text):
                  problems.append(f"{f}: {m.group(0)} — Grafana does not expand shell-style defaults")
              for m in re.finditer(r"(?i)^\s*password:\s*(.+)$", text, re.M):
                  if not m.group(1).strip().startswith("${"):
                      problems.append(f"{f}: password is a literal, not an environment reference")

          uids = set()
          for f in sorted(pathlib.Path("grafana/provisioning/datasources").rglob("*.yml")):
              for m in re.finditer(r"^\s*uid:\s*(\S+)", f.read_text(), re.M):
                  uids.add(m.group(1))

          FORBIDDEN = ("restricted.", "public.events", " events ")
          dashboards = sorted(pathlib.Path("grafana/dashboards").rglob("*.json"))
          if not dashboards:
              problems.append("no dashboards found — the check is looking in the wrong place")

          for f in dashboards:
              try:
                  doc = json.loads(f.read_text())
              except json.JSONDecodeError as exc:
                  problems.append(f"{f}: not valid JSON — {exc}")
                  continue
              for panel in doc.get("panels", []):
                  for t in panel.get("targets", []):
                      uid = (t.get("datasource") or {}).get("uid")
                      if uid not in uids:
                          problems.append(
                              f"{f}: panel {panel.get('id')} points at datasource {uid!r}, "
                              f"which is not provisioned (have: {sorted(uids)})")
                      sql = (t.get("rawSql") or "").lower()
                      for bad in FORBIDDEN:
                          if bad.strip() and bad in sql:
                              problems.append(
                                  f"{f}: panel {panel.get('id')} queries {bad.strip()!r} — "
                                  f"the dashboard connection is not permitted to read it")

          print(f"checked {len(prov)} provisioning files and {len(dashboards)} dashboards")
          if problems:
              print("\n".join("  FAIL " + p for p in problems))
              sys.exit(1)
          print("  no shell-default syntax, no literal credentials, "
                "every panel on a provisioned datasource, none reading per-account rows")
          EOF

      - name: Negative control — the checks must be able to fail
        # One planted defect per check, applied and reverted individually, because
        # a control that trips several checks at once proves only that at least one
        # of them works.
        #
        # Written in Python rather than `sed -i`, which is not portable: BSD sed
        # rejects the GNU spelling, so on a developer's machine the mutation
        # silently does not apply. That matters more than portability usually does
        # here — a control that fails to mutate reports "the check passed a broken
        # tree" when nothing was ever broken, which is the exact false alarm this
        # step exists to rule out. Every mutation asserts the file changed.
        run: |
          python3 - <<'EOF'
          import hashlib, json, pathlib, re, sys

          ds   = pathlib.Path("grafana/provisioning/datasources/timescaledb.yml")
          dash = sorted(pathlib.Path("grafana/dashboards").rglob("*.json"))[0]
          originals = {p: p.read_bytes() for p in (ds, dash)}
          digest = {p: hashlib.sha256(b).hexdigest() for p, b in originals.items()}

          def strip(t):
              return "\n".join(re.sub(r"(?:^|\s)#.*$", "", l) for l in t.splitlines())

          def check():
              """The same three assertions the step above makes."""
              found = []
              for f in sorted(pathlib.Path("grafana/provisioning").rglob("*.yml")):
                  text = strip(f.read_text())
                  found += [f"{f}: shell default"
                            for _ in re.finditer(r"\$\{[A-Za-z_][A-Za-z0-9_]*:[-?][^}]*\}", text)]
                  for m in re.finditer(r"(?i)^\s*password:\s*(.+)$", text, re.M):
                      if not m.group(1).strip().startswith("${"):
                          found.append(f"{f}: literal credential")
              for f in sorted(pathlib.Path("grafana/dashboards").rglob("*.json")):
                  doc = json.loads(f.read_text())
                  for panel in doc.get("panels", []):
                      for t in panel.get("targets", []):
                          if "restricted." in (t.get("rawSql") or "").lower():
                              found.append(f"{f}: panel {panel.get('id')} reads per-account rows")
              return found

          def mutate_ds(old, new):
              text = ds.read_text()
              # Only outside comments — the file explains the trap by quoting it,
              # so a naive replace would edit the sentence and not the setting.
              body = [l for l in text.splitlines() if not l.lstrip().startswith("#")]
              if sum(old in l for l in body) != 1:
                  return None
              ds.write_text(text.replace(old, new, 1) if old in text else text)
              return ds.read_text() != text

          try:
              if check():
                  print("the tree is already failing its own checks before any mutation")
                  sys.exit(1)

              results = []

              # 1. the shell-style default this job exists for
              ok = mutate_ds("database: ${POSTGRES_DB}", "database: ${POSTGRES_DB:-reporadar}")
              results.append(("shell-style default", ok, len(check())))
              ds.write_bytes(originals[ds])

              # 2. a credential written as a literal
              ok = mutate_ds("password: ${GRAFANA_DB_PASSWORD}", "password: hunter2")
              results.append(("literal credential", ok, len(check())))
              ds.write_bytes(originals[ds])

              # 3. a panel reading the per-account schema
              doc = json.loads(dash.read_text())
              doc["panels"][0]["targets"][0]["rawSql"] = "select count(*) from restricted.actor_daily"
              dash.write_text(json.dumps(doc))
              ok = dash.read_bytes() != originals[dash]
              results.append(("per-account query", ok, len(check())))
              dash.write_bytes(originals[dash])

              bad = 0
              for name, applied, findings in results:
                  if not applied:
                      print(f"  FAIL {name}: mutation did not apply — this control tests nothing")
                      bad += 1
                  elif findings == 0:
                      print(f"  FAIL {name}: applied, and the check did not notice")
                      bad += 1
                  else:
                      print(f"  fired {name}: {findings} finding(s)")
              if bad:
                  sys.exit(1)
          finally:
              for p, b in originals.items():
                  p.write_bytes(b)
              for p in originals:
                  if hashlib.sha256(p.read_bytes()).hexdigest() != digest[p]:
                      print(f"  FAIL {p} was not restored"); sys.exit(1)
              print("  all files restored byte-identical")

          print("negative control fired: every check rejects its own planted defect")
          EOF
